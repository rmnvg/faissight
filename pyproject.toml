[project]
name = "faissight"
version = "0.0.1"
description = "See inside your FAISS index: debug retrieval, tune recall."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rmnvg", email = "ramanjotsingh247@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["faiss", "vector-search", "ann", "rag", "retrieval", "visualization", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
faiss-cpu = ["faiss-cpu>=1.8"]
umap = ["umap-learn>=0.5"]
text = ["sentence-transformers>=2.2"]
parquet = ["pyarrow>=14"]
all = ["faissight[faiss-cpu,umap,text,parquet]"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.5",
    "httpx>=0.27",
]

[project.scripts]
faissight = "faissight.cli:app"

[project.urls]
Homepage = "https://github.com/rmnvg/faissight"
Repository = "https://github.com/rmnvg/faissight"
Issues = "https://github.com/rmnvg/faissight/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# static/ is gitignored (it's a build output) but must ship, so force-include it.
artifacts = ["src/faissight/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/faissight"]

[tool.hatch.build.targets.sdist]
include = ["src/faissight", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "src/faissight/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]

[tool.mypy]
python_version = "3.10"
files = ["src/faissight"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faissight.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["faissight"]
branch = true
